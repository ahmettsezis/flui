name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issues: please follow [SECURITY.md](https://github.com/ahmettsezis/flui/blob/main/SECURITY.md) instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flui version
      description: Output of `flui-server version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / Docker / Kubernetes, Fluentd version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, passwords and hostnames you do not want to share.
      render: text
