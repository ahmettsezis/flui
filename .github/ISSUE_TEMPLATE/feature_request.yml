name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could flui solve it? Keep in mind that flui aims to stay small.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
